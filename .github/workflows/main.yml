name: Deploy to EC2 Neel

on: workflow_dispatch 

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Validate deployment configuration 2
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          APP_PASSWORD_PARAMETER_NAME: ${{ vars.APP_PASSWORD_PARAMETER_NAME }}
        run: |
          set -euo pipefail
          test -n "$EC2_INSTANCE_ID" || { echo "Set the EC2_INSTANCE_ID repository variable"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Set the ECR_REPOSITORY repository variable"; exit 1; }
          test -n "$APP_PASSWORD_PARAMETER_NAME" || { echo "Set APP_PASSWORD_PARAMETER_NAME to the SSM SecureString parameter name"; exit 1; }
          [[ "$EC2_INSTANCE_ID" =~ ^i-([0-9a-f]{8}|[0-9a-f]{17})$ ]] || {
            echo "EC2_INSTANCE_ID must be the full EC2 ID, including the i- prefix (for example: i-03ddcc7c09466e1e2)"
            exit 1
          }
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]] || {
            echo "ECR_REPOSITORY must be a valid lowercase ECR repository name"
            exit 1
          }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$ ]] || {
            echo "AWS_REGION is not in the expected AWS region format"
            exit 1
          }

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:api-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:frontend-${{ github.sha }}

      - name: Deploy images to EC2 with Systems Manager
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_PASSWORD_PARAMETER_NAME: ${{ vars.APP_PASSWORD_PARAMETER_NAME }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          compose_gz_b64=$(gzip -9 -c compose.yaml | base64 -w 0)
          caddy_gz_b64=$(gzip -9 -c Caddyfile | base64 -w 0)
          remote_script=$(cat <<EOF
          set -eu
          app_root="/opt/r2-assessment"
          env_file="\$app_root/.env"
          mkdir -p "\$app_root"
          command -v aws >/dev/null 2>&1 || { echo "AWS CLI is required on EC2 to authenticate with ECR." >&2; exit 1; }
          command -v docker >/dev/null 2>&1 || { echo "Docker is not installed on EC2." >&2; exit 1; }
          docker compose version >/dev/null
          db_password=\$(aws ssm get-parameter \
            --name '${APP_PASSWORD_PARAMETER_NAME}' \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)
          if [ -z "\$db_password" ] || [ "\$db_password" = "None" ]; then
            echo "SSM returned an empty database password." >&2
            exit 1
          fi
          touch "\$env_file"
          chmod 600 "\$env_file"
          env_tmp="\$(mktemp "\$app_root/.env.XXXXXX")"
          if grep -v '^POSTGRES_PASSWORD=' "\$env_file" > "\$env_tmp"; then
            :
          else
            grep_status=\$?
            if [ "\$grep_status" -ne 1 ]; then
              rm -f "\$env_tmp"
              exit "\$grep_status"
            fi
          fi
          printf 'POSTGRES_PASSWORD=%s\n' "\$db_password" >> "\$env_tmp"
          chmod 600 "\$env_tmp"
          mv "\$env_tmp" "\$env_file"
          unset db_password
          printf '%s' '${compose_gz_b64}' | base64 -d | gzip -d > "\$app_root/compose.yaml"
          printf '%s' '${caddy_gz_b64}' | base64 -d | gzip -d > "\$app_root/Caddyfile"
          printf 'API_IMAGE=%s/%s:api-%s\nFRONTEND_IMAGE=%s/%s:frontend-%s\n' \
            '${ECR_REGISTRY}' '${ECR_REPOSITORY}' '${DEPLOY_SHA}' \
            '${ECR_REGISTRY}' '${ECR_REPOSITORY}' '${DEPLOY_SHA}' > "\$app_root/deploy.env"
          chmod 600 "\$app_root/deploy.env"
          aws ecr get-login-password --region '${AWS_REGION}' \
            | docker login --username AWS --password-stdin '${ECR_REGISTRY}'
          cd "\$app_root"
          docker compose --project-name r2-assessment \
            --env-file "\$env_file" --env-file "\$app_root/deploy.env" \
            -f compose.yaml pull api frontend
          docker compose --project-name r2-assessment \
            --env-file "\$env_file" --env-file "\$app_root/deploy.env" \
            -f compose.yaml up -d --no-build --remove-orphans
          EOF
          )
          parameters=$(jq -n --arg command "$remote_script" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${DEPLOY_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)
          for attempt in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|TimedOut|Cancelled)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Deployment command timed out: $command_id"
          exit 1
